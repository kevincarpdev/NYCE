services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: file:/data/.db
      UPLOAD_DIR: /data/files
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - hub-data:/data
      - ../src/seed/bootstrap.ts:/app/src/seed/bootstrap.ts:ro
    expose:
      - '3000'
    command:
      - sh
      - -c
      - NODE_ENV=development node_modules/.bin/tsx src/seed/bootstrap.ts && node_modules/.bin/next start -H 0.0.0.0 -p 3000
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  hub-data:
  caddy-data:
  caddy-config:
